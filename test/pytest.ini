[pytest]
testpaths = .
markers =
    slow: uses the real 5400x5400 DEM and/or the full optimizer (deselect with -m "not slow")
    scenario: end-to-end invariants of main() (land avoidance, curvature) - these guard fixed bugs
    ns3_output: validates ns-3 *_linkbudget.csv output; skipped if no such file is found
addopts = -ra
